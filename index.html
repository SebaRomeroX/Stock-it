<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Stock-it — Store Management</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">Stock-it</h1>
      <span class="app-tagline">store management</span>
    </header>

    <main class="app-main" id="view">
      <!-- Views render here -->
    </main>

    <nav class="app-nav" aria-label="Main">
      <button class="nav-btn is-active" type="button" data-view="dashboard">
        <span class="nav-icon" aria-hidden="true">▦</span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-btn" type="button" data-view="products">
        <span class="nav-icon" aria-hidden="true">▤</span>
        <span class="nav-label">Products</span>
      </button>
      <button class="nav-btn" type="button" data-view="settings">
        <span class="nav-icon" aria-hidden="true">⚙</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>
  </div>

  <!-- Modal shell (reusable, survives view swaps) -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="modal-close" type="button" aria-label="Close">×</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Transient toast for errors outside modals -->
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
